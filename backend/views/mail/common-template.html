<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body
    style=" font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; box-sizing: border-box;			background-color: #fff; color: #74787e; height: 100%; hyphens: auto; line-height: 1.4; margin: 0; -moz-hyphens: auto; -ms-word-break: break-all; width: 100% !important; -webkit-hyphens: auto; webkit-text-size-adjust: none; word-break: break-word;">
    <style>
        @media only screen and (max-width: 600px) {
            .inner-body {
                width: 100% !important;
            }

            .footer {
                width: 100% !important;
            }
        }

        @media only screen and (max-width: 500px) {
            .button {
                width: 100% !important;
            }
        }
    </style>

    <table class="wrapper" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
					Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji',
					'Segoe UI Emoji', 'Segoe UI Symbol';
				box-sizing: border-box;
				background-color: #fff;
				margin: 0;
				padding: 0;
				-premailer-cellpadding: 0;
				-premailer-cellspacing: 0;
				-premailer-width: 100%;
			">
        <tr>
            <td align="center" style="
						font-family: -apple-system, BlinkMacSystemFont,
							'Segoe UI', Roboto, Helvetica, Arial, sans-serif,
							'Apple Color Emoji', 'Segoe UI Emoji',
							'Segoe UI Symbol';
						box-sizing: border-box;
					">
                <table class="content" width="600" cellpadding="0" cellspacing="0" role="presentation" style="
							font-family: -apple-system, BlinkMacSystemFont,
								'Segoe UI', Roboto, Helvetica, Arial, sans-serif,
								'Apple Color Emoji', 'Segoe UI Emoji',
								'Segoe UI Symbol';
							box-sizing: border-box;
							margin: 0;
							padding: 15px;
							width: 600px;
							-premailer-cellpadding: 0;
							-premailer-cellspacing: 0;
							-premailer-width: 100%;
						">
                    <tr>
                        <td class="header" style="
									font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; box-sizing: border-box; padding: 22px 0; text-align: center; background: #0b1046;
								">
                            <a href="{{app_url}}" style="
										font-family: -apple-system,
											BlinkMacSystemFont, 'Segoe UI',
											Roboto, Helvetica, Arial, sans-serif,
											'Apple Color Emoji',
											'Segoe UI Emoji', 'Segoe UI Symbol';
										box-sizing: border-box;
										color: #b1d483;
										font-size: 19px;
										font-weight: bold;
										text-decoration: none;
									">
                                <!-- <img src="{{app_logo}}" alt="Logo" style="max-width: 70px" /> -->
                                <!-- <img src="{{app_logo}}" style="height:40px;width:90px;border:0;" height="40"
                                    width="90" /> -->
									Suman's Blog
                            </a>
                        </td>
                    </tr>

                    <!-- Email Body -->
                    <tr>
                        <td class="body" width="100%" cellpadding="0" cellspacing="0" style=" font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,  -serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
									box-sizing: border-box;
									background-color: #fff;
									border-bottom: 1px solid #e5e5e5;
									border-top: 1px solid #e5e5e5;
									margin: 0;
									padding: 0;
									width: 100%;
									-premailer-cellpadding: 0;
									-premailer-cellspacing: 0;
									-premailer-width: 100%;
								">
                            <table class="inner-body" align="center" width="570" cellpadding="0" cellspacing="0"
                                role="presentation" style="
										font-family: -apple-system,
											BlinkMacSystemFont, 'Segoe UI',
											Roboto, Helvetica, Arial, sans-serif,
											'Apple Color Emoji',
											'Segoe UI Emoji', 'Segoe UI Symbol';
										box-sizing: border-box;
										background-color: #fff;
										margin: 0 auto;
										padding: 0;
										width: 570px;
										-premailer-cellpadding: 0;
										-premailer-cellspacing: 0;
										-premailer-width: 570px;
									">
                                <!-- Body content -->



                                <tr>
                                    <td align="center" style="
												font-family: -apple-system,
													BlinkMacSystemFont,
													'Segoe UI', Roboto,
													Helvetica, Arial, sans-serif,
													'Apple Color Emoji',
													'Segoe UI Emoji',
													'Segoe UI Symbol';
												box-sizing: border-box;
												background-color: #f0ecec;
											">
                                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="
													font-family: -apple-system,
														BlinkMacSystemFont,
														'Segoe UI', Roboto,
														Helvetica, Arial,
														sans-serif,
														'Apple Color Emoji',
														'Segoe UI Emoji',
														'Segoe UI Symbol';
													box-sizing: border-box;
												">
                                            <tr>
                                                <td style="padding: 0 10px">
                                                    <div style="
																font-family: -apple-system,
																	BlinkMacSystemFont,
																	'Segoe UI',
																	Roboto,
																	Helvetica,
																	Arial,
																	sans-serif,
																	'Apple Color Emoji',
																	'Segoe UI Emoji',
																	'Segoe UI Symbol';
																box-sizing: border-box;
																color: #000;
																font-size: 16px;
																line-height: 1.5em;
																margin-top: 0;
																text-align: justify;
																text-align: center;
																margin-bottom: 5px;
															">
                                                        {{{message}}}
														
												</div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="
									font-family: -apple-system,
										BlinkMacSystemFont, 'Segoe UI', Roboto,
										Helvetica, Arial, sans-serif,
										'Apple Color Emoji', 'Segoe UI Emoji',
										'Segoe UI Symbol';
									box-sizing: border-box;
									background: #0b1046;
								">
                            <table class="footer" align="center" width="570" cellpadding="0" cellspacing="0"
                                role="presentation" style="
										font-family: -apple-system,
											BlinkMacSystemFont, 'Segoe UI',
											Roboto, Helvetica, Arial, sans-serif,
											'Apple Color Emoji',
											'Segoe UI Emoji', 'Segoe UI Symbol';
										box-sizing: border-box;
										margin: 0 auto;
										padding: 0;
										text-align: center;
										width: 570px;
										-premailer-cellpadding: 0;
										-premailer-cellspacing: 0;
										-premailer-width: 570px;
									">
                                <tr>
                                    <td class="content-cell" align="center" style="
												font-family: -apple-system,
													BlinkMacSystemFont,
													'Segoe UI', Roboto,
													Helvetica, Arial, sans-serif,
													'Apple Color Emoji',
													'Segoe UI Emoji',
													'Segoe UI Symbol';
												box-sizing: border-box;
												padding: 20px;
											">
                                        <p style=" font-family: -apple-system,
														BlinkMacSystemFont,
														'Segoe UI', Roboto,
														Helvetica, Arial,
														sans-serif,
														'Apple Color Emoji',
														'Segoe UI Emoji',
														'Segoe UI Symbol';
													box-sizing: border-box;
													line-height: 1.5em;
													margin-top: 0;
													margin-bottom: 0;
													color: #aeaeae;
													font-size: 14px;
													text-align: center; "> © {{copyright_year}} <a style="text-decoration: none; color:#a4ad22;"
                                                href="{{app_url}}"><b> Suman's Blog</b></a>. All rights reserved. </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
